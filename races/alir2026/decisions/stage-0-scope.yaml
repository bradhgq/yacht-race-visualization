privacy:                         # prime rule 4
  crew_log: "The owner's crew log is a PRIVATE input and does not enter the repo. It was
    read in-session for hypothesis generation and for the tier-2 events layer, and this
    record quotes it only where a quotation is load-bearing for a verdict (the 04:25 and
    21:00 decision entries). events.yaml ships as a placeholder in this draft; the
    log-derived event proposal is presented AT the stage-0 stop and enters the repo
    item-by-item on the owner's explicit opt-in, each with a visibility flag."
  build: public

owner_decisions_needed:          # the stage-0 stop — these gate everything downstream
  - "FINISH TIME: did Max cross at ~11:57 or ~12:38 EDT Saturday? (finish_time_discrepancies)"
  - "SNAPSHOT vs FINAL: build the preliminary dashboard on this in-progress snapshot now and
    re-fetch later, or wait for final results? (Recommendation: build now — the hero's own
    race is complete and stable; treat fleet-tail statistics as provisional and re-run
    stage 0 after final scoring.)"
  - "TIER-3 SPINE: is h4 (the two-nights pattern) the story, or does the owner want the
    forecast-vs-reality axis as the spine with the two nights as its evidence?"
  - "CREW-LOG EVENTS: which log entries may ship publicly, and under which category?"
  - "REFERENCE SET: confirm or amend the five boats above."
  - "H3 CONFIDENCE: the Sound-side claim rests on n=14 and a partial correlation. Ship it
    with an explicit hedge, or hold it until stage 2 can widen the band?"

owner_stop_decisions:            # the stage-0 stop outcome, owner's words paraphrased —
                                 # each is BINDING on stages 1-4
  opinions_held: "Stage 0 does not form opinions. The exploratory verdicts above are
    retracted to hypothesis status; verdict-forming happens at stages 1-2 with more
    research. Nothing above ships or is cited until re-derived there."
  phase_boundaries: "The 21-mile decomposition's clock-window segments are REJECTED as
    presented. Stage 2 must segment on the race's NATURAL transitions as the crew
    experienced them: (1) the start and beat before the Ambrose turn; (2) the turn onto
    the reach, 'where we caught a lot of boats'; (3) the first night's dying breeze;
    (4) the rebuild through Montauk and Plum Gut; (5) the Sound night; (6) the final
    day to the finish. Boundaries must be derived from the data (turn points, wind-phase
    changes), not from round clock hours."
  peer_sets: "Katara56 alone is NOT an adequate benchmark. Each phase gets its own peer
    set: the boats PHYSICALLY CLOSEST to Max during that phase — regardless of division,
    and not necessarily the same boats phase to phase — because only boats in the same
    water and weather support an apples-to-apples judgment of the human calls. The
    division-scoped comparison remains for corrected-time claims; the navigation story
    uses spatial peers."
  night1_reframed: "Owner's sharpened hypothesis, replacing the original: Katara56 went
    offshore during the first night and Max did not — the ground was lost, or the losing
    position was taken, DURING night 1 even if the distance-to-finish gap only opened at
    the morning build. Stage 2 must separate contemporaneous loss from positional setup,
    and visualize the divergence rather than assert it."
  build_timing: "Proceed with stages 1+ NOW on the in-progress snapshot; owner re-fetches
    final data tomorrow (2026-07-27). The re-fetch diff re-runs the stage-0 ritual."
  tier3_spine: "DEFERRED — re-ask at a later stage with concrete alternatives and details."
  crew_log: "Build an INTERNAL (non-public) events version first; the owner prunes it
    before anything ships. AND: treat the crew log itself with a grain of salt — it is
    one tired, self-described-inexperienced crew member's recollection, not ground truth.
    Research and synthesize more objective data; where the log and instruments/tracker/
    weather evidence disagree, the log yields."
  reference_boats: "Same directive as peer_sets — the named five stand for division-level
    scoring comparisons, but navigation-phase comparisons draw from spatial proximity."
  finish_time: "Owner confirms Max crossed at ~11:57; RC contact initiated. See
    finish_time_discrepancies.owner_answer."

