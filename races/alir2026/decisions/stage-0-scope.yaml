# stage-0 — Scope Record — Around Long Island Regatta 2026 (49th), Sea Cliff YC
# CONFIRMED by the owner 2026-07-26 with the amendments recorded in
# owner_stop_decisions at the end of this file. The exploratory verdicts under
# hypotheses_to_test are RETRACTED to hypothesis status by owner instruction —
# opinions form at stages 1-2, not stage 0. The hypotheses and their preliminary
# signals are retained below as the ledger of what was believed and why; nothing
# in them may be cited as a finding until stage 2 re-derives it.
#
# Every number below was computed from races/alir2026/raw/. Exploratory figures are
# labelled as such: NO number here is a pinned value, and none has been through the
# pipeline (prime rule 1). Claims the data REFUTED are kept as explicit corrections
# rather than deleted, so the ledger shows what was believed and why it changed.

