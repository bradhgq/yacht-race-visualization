  race_state: "STILL RUNNING at acquisition. Data fetched 2026-07-26T00:58 EDT; the
    time limit is 12:00 EDT 2026-07-26 and 7 ALI-course boats were still at sea.
    Protest hearings open 11:00 Sunday 2026-07-26, so EVERY official number here is
    PROVISIONAL."
  hero_unaffected: "Max and all three of her Division 9 rivals finished, so the hero's
    own analysis is complete and stable. What is incomplete is the FLEET tail (8
    unscored boats) and any fleet-wide ranking or spread statistic."
  required_followup: "Re-fetch results + tracks after final scoring, re-run the whole
    stage-0 ritual, and diff. Recorded in docs/OPEN_THREADS.md. Do NOT pin values
    (prime rule 3) from this snapshot — pin them at the stage-2 stop after the
    re-fetch, or pin explicitly-labelled preliminary values with the owner's recorded
    instruction."

acquisition:
  command: "python3 starter/acquisition/fetch_race.py 50645 --yb alir26 --prefix alir2026
    --out-dir races/alir2026/raw/   (run 2026-07-26T00:58:13-0400)"
  ys_event_id: 50645
  yb_race_id: alir26
  yb_id_provenance: "satTrackingUrl is EMPTY in the YS event metadata (the 2025 situation
    repeats), and neither alir.org nor its /tracking page publishes the YB link, so the
    normal YS-hands-you-the-YB-id chain is BROKEN. The id 'alir26' was formed on the
    alir25 precedent and then VERIFIED by the full ritual before use, never trusted:
      - RaceSetup.title = 'Around Long Island Regatta', 56 teams
      - team names match the YachtScoring entry list (53 ACTIVE entries; every results
        row resolves to a track)
      - first pings cluster at 40.60-40.74N / -74.07..-74.00 — NY Harbor, the SI start box
      - the 8 distinct team start epochs are 07-23 13:00..14:15 EDT, exactly the SI's
        13:00 first warning + 10-minute groups
      - the tracked committee marker 'STARTING LINE (+ FINISH)' sits at 40.7018,-74.0365
        (0.06 nm from the SI start coordinate) for the first two days, then anchors at
        40.8609,-73.6640 by the finish light. The tracker itself confirms both ends of
        the course."
  warnings_raised: 2             # per 'report every warning the run produces'
    # 1. "YB decoded 54 tracked boats but RaceSetup lists 56 — public track data is a
    #    SUBSET of the fleet (the Ida Lewis case)"
    #    -> RESOLVED, and it is NOT the Ida Lewis case. The two are Avalanche and Gup E,
    #       both INACTIVE (withdrawn) on the scratch sheet: they were entered, given YB
    #       ids, and never sailed. Coverage of the boats that actually raced is COMPLETE
    #       (53 of 53). See coverage_matrix.
    # 2. "6 name-join row(s) need review"
    #    -> RESOLVED; full composition in anomalies. 1 sail-only (Little Texas),
    #       1 UNMATCHED-YB (the committee marker), 4 UNMATCHED-YS (3 withdrawn entries
    #       + the Habiru duplicate-entry pair).
  source_documents:
    si: "Final 2026 ALIR SI, YachtScoring event-documents endpoint
      (api.yachtscoring.com/v1/public/event/50645/docs -> documentType SI, docName
      'Final 2026 ALIR SI', 399,787 bytes, updated 2026-07-26T04:46Z).
      sha256 7f78a273c66999c03befd7f07efc7ff0ff8b8e7575f3278792d3feeb9cdbaf36.
      Supplies verbatim: start line 40°42'10\"N/74°02'12\"W ~0.25 nm NE of Ellis Island;
      the ONE mandatory mark, Ambrose Channel Red Bell Q R '14' 40°31'41\"N/74°00'34\"W to
      port; 'east to Montauk Point, northwest to Long Island Sound, west to the finish';
      finish line between the finish vessel ~0.075 nm due W of the Glen Cove Breakwater
      light 40°51'43\"N/73°39'37\"W and the breakwater; and 'This course will be considered
      207 nm for scoring purposes'."
    si_internal_conflict: "The SI states the Around-the-Islands course distance TWICE and
      DISAGREES with itself: the COURSES section says 242 nm, the SCORING & TIME ALLOWANCES
      section says 230 nm. Immaterial here (the single ATI boat, Nomad, is out of scope and
      unscored at snapshot) but it must not be silently averaged or picked — flag to the
      organizer, and if an ATI boat is ever brought in scope, resolve it first."
    si_stale_dates: "The SI carries two 2025 dates in boilerplate ('by 1200 hours on Sunday,
      July 27, 2025' for the time limit; protests 'Sunday, July 27, 2025'). The 2026
      calendar makes these Jul 26; treated as clerical, not as evidence about the time
