anomalies:
  - "TZ MISLABEL PERSISTS FROM 2025 (adjudicated): results finish_time_utc is EDT wall
     clock carrying a spurious Z. Probe: for 36 of 40 finishers YB's own finish marker
     sits at the claimed wall-clock time +4.00 h, each marker within 0.03-0.15 nm of the
     Glen Cove light. Consequence: derive_results_columns.py strips the fake Z and applies
     NO offset shift, exactly as in 2025."
  - "MIXED SCORING SYSTEMS — NEW IN 2026 and the single biggest structural change from
     2025. ORC Division 0 (6 boats) scores time-on-TIME on a multiplier; every other
     division scores PHRF time-on-DISTANCE at 207.0 nm. config scoring.system is
     therefore 'custom' with hook scoring_alir:corrected, dispatching on rating value
     (ORC 0.8312-0.9625; PHRF integer -24..171 sec/mi; nothing in (0,2), so the bands
     cannot collide). Verified: all 42 AOK rows reproduce official corrected within 1 s
     (36 ToD + 6 ToT). CONSEQUENCE FOR COPY: corrected times are NEVER comparable across
     the ORC/PHRF boundary. A cross-division 'unofficial unified ladder' — which ALIR
     2025 shipped and which worked there because every division shared one ToD formula —
     is NOT available this year. Do not build one."
  - "DUPLICATE ENTRY NAME, the 2025 Dolcezza lesson in a new costume: the scratch sheet
     carries BOTH 'Habiru' (INACTIVE, withdrawn) and 'Habiru YCC' (ACTIVE, ORC Division 0
     winner) on the SAME sail number USA61124. The tracker calls her 'Habiru'. The join
     must bind the tracker to the ACTIVE entry — handled by name_overrides.by_name
     Habiru -> 'Habiru YCC'. Keying on name alone would bind a live boat to a withdrawn
     row. Any future join keys on (name, sail), never name."
  - "SUFFIX DIRECTION REVERSED vs 2025: this year YB carries 'Little Texas YCC' and
     YachtScoring carries 'Little Texas' (2025 was the other way round). Handled by
     by_name; the join matched it on sail number alone, which is why it appeared in the
     6-row review list. Betelgeuse and Valiant carry 'YCC' in BOTH sources and need
     no override."
  - "CASE-ONLY differences (tracker mixed-case vs results ALL-CAPS): ACTAEA, ARGOS, DUET,
     MARA, MARIE, SCAPEGOAT, WANDERER, VICITAN. Handled by name_overrides.display ONLY —
     the join normalizer casefolds, so a by_name entry would not help the match while
     still rewriting the tracker name that ships as the fleet ghost's hover label
     (the 2025 'ACADIA beside a chip reading Acadia' finding)."
  - "526 duplicate (boat, epoch) ping rows, 7 of them genuine position conflicts (the rest
     byte-identical re-emissions). All dropped by trim_tracks.py, first row kept. The 7
     conflicts are sub-metre and immaterial; 2025 had exactly one."
  - "PING CADENCE CHANGED BETWEEN YEARS: 2025 was a uniform 5-minute feed; 2026 carries a
     ~1-minute tier — 40.3% of intervals are <=60 s, 58.7% are 61-300 s, median 300 s.
     This broke the inherited trim heuristic (see trim_adjustments) and it will affect any
     analysis that assumes a fixed cadence. grid.minutes 15 with interpolate_limit 4
     remains comfortably above the cadence and covers every in-race gap."
  - "COMMITTEE MARKER IN THE TRACK DATA: 'STARTING LINE (+ FINISH)' is a race-committee
     position beacon, not a boat — 207 pings, stationary at the start line then at the
     finish. It is the ONLY exclude_boats entry. It is also genuinely useful evidence: it
     independently confirms both course endpoints (above)."
  - "COURSE POLYLINE INHERITED FROM 2025 AND RE-VERIFIED, not assumed. The SI's three
     quoted coordinates are character-identical to 2025, so the 2025 marks list is reused;
     it was then re-checked against the 2026 fleet envelope — routed distance-to-finish is
     monotone for every finisher and no leg passes inshore of any racing track. Polyline
     205.84 nm vs the official 207.0 (delta -1.16), as in 2025."
  - "XTE IS NOT AN OFF-COURSE METRIC ON THIS COURSE MODEL (carried forward from 2025): the
     three south-shore spine waypoints are drafted from the 2025 sailed median, not from
     marks anyone had to round, so legitimate racing tracks reach large cross-track values.
     Stage 2 must not read XTE here as 'sailed extra distance'."
  - "place_overall IS PER-CIRCLE, not fleet-wide (as in 2025): Dolcezza, Habiru YCC and
     Zammermoos all carry rank 1. The shell's ranked list sorts on that field and would
     display '#1' three times. Stage-2 presentation decision: rank per circle, or scope
     the ranked list."

finish_time_discrepancies:       # the one material cross-source conflict — FLAGGED, NOT SMOOTHED
  finding: "YB writes an off-cadence finish marker at the line for every finisher. For 36
    of 40 it matches the official finish time within 1.6 min (most within 10 s), which is
    strong evidence the two sources share the race committee's finish log. FOUR boats
    disagree by far more, and one of them is the hero:
      DUET   marker 07-25 10:53:54, official 12:02:08   (+68.2 min)
      Max    marker 07-25 11:57:24, official 12:38:03   (+40.6 min)
      MARIE  marker 07-25 17:41:15, official 18:09:33   (+28.3 min)
      Ripple marker 07-25 17:31:45, official 17:39:41   (+7.9 min)
    In each case the marker sits 0.03-0.07 nm from the finish light with the same
    signature as every clean finish. After her marker, Max drifts south, wanders for
    ~30 min and is STATIONARY 0.47 nm inside the harbour from 12:25 — she is not moving
    at her official 12:38:03. MARIE is 1.98 nm NORTH of the line, sailing away, at hers."
  candidate_explanations: "(a) provisional scoring — the race was still being scored and
    these four rows may yet be corrected; (b) finish times taken by VHF hail (the SI asks
    boats to hail the finish vessel) and logged late in light air; (c) the boats touched
    the line area without validly finishing and were recorded later. NOT resolvable from
    the data in hand."
  disposition: "Official results remain the endpoint authority (doctrine 2) — the pipeline
    uses the published values unchanged, and derive_results_columns.py passes them through
    untouched. The conflict is recorded, not averaged away."
  owner_question: "OWNER CAN SETTLE THIS DIRECTLY — he sailed on Max. Did Max cross the
    finish line at ~11:57 or ~12:38 EDT on Saturday?"
  owner_answer: "ANSWERED at the stage-0 stop (2026-07-26): 'we finished at 1157 and will
    contact RC for clarity.' Crew testimony agrees with the YB marker against the published
    12:38:03. Official results REMAIN the pipeline authority until the RC responds or a
    results amendment lands; the 11:57 crossing is now testimony + tracker, the 12:38 is
    official-provisional. Re-check on the post-race re-fetch."
  sensitivity: "MATERIAL to the headline number, immaterial to the story. Max's elapsed is
    46:43:03 as published (gap to Katara56 212.1 min); on the YB marker it would be
    46:02:24 (gap 171.4 min). The loss decomposition below is computed from POSITIONS
    DURING the race and is unchanged either way — both decisive windows close before
    Saturday morning."

