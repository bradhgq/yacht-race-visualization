course_model: "marks (routed DTF via pipeline/route.py) — identical to 2025. Start
  [40.7028,-74.0367] ~0.25 nm NE of Ellis Island. South out of NY Harbor under the
  Verrazzano, leaving Ambrose Channel Red Bell Q R '14' [40.5281,-74.0094] to port (the ONE
  mandatory mark). East along the south shore on a spine drafted from the sailed median
  (the direct Ambrose->Montauk great circle crosses Long Island), round Montauk Point
  [41.0600,-71.8450], northwest to Plum Gut [41.1680,-72.2150], down the Sound, finishing
  [40.8619,-73.6603] off the Glen Cove Breakwater light. Polyline 205.84 nm vs official
  207.0."

sound_entry_gate: "Plum Gut again, and by a wider margin than 2025. Of the boats checked,
  Max, Katara56, Zammermoos, Poseidon and Habiru YCC all passed within 0.08-0.31 nm of the
  Plum Gut centrepoint. Lioness (2.26 nm off) and Della Aurora (1.69 nm off) took a
  different line — the Sluiceway/Gull passage rather than The Race, on the 2025 pattern.
  Full per-boat gate table is a stage-2 deliverable; the numbers here are exploratory."

hypotheses_to_test:              # doctrine 7 — the stakeholder's hypothesis is TESTED before
                                 # any view is built, and ships with the verdict in its caption.
                                 # Everything below is EXPLORATORY (not pipeline output).
  owner_hypothesis:
    as_stated: "'In retrospect I think we made some not great choices navigation wise in the
      first night' — owner, crewing on Max."
    verdict: "REFUTED AS STATED, and replaced by a sharper finding the data does support.
      The first night was Max's BEST phase of the race. Measured against Katara56 — who
      carries the IDENTICAL -18 rating, so elapsed gap == corrected gap — Max was DEAD
      LEVEL at 04:00 Friday after a whole night of sailing (gap 0.0 -> +0.2 nm in Max's
      favour). Against the eventual division winner Zammermoos she was 4.3 nm down, and
      against Poseidon 3.3 nm, over ~14 hours: real but modest, and the smallest deficits
      she would carry all race."
    where_it_actually_went: "Two windows, both AFTER the first night, account for 97% of a
      21.0 nm deficit to Katara56 (time-aligned: both boats measured at the same instant,
      so no phase-offset artifact):
        gun -> 04:00 Fri  (start + night 1)              +0.2 nm   Max marginally AHEAD
        04:00 -> 12:00 Fri (dawn transition + park exit)  -9.7 nm   <=== decisive
        12:00 -> 20:00 Fri (rebuild, Montauk, Plum Gut)   +2.3 nm   Max gains
        20:00 Fri -> 02:00 Sat (night 2, the Sound)      -10.7 nm   <=== decisive
        02:00 -> 06:00 Sat (pre-dawn Sound)               -3.1 nm
      A 21 nm deficit at 06:00 Saturday, at Max's ~6.3 kt closing pace over the final
      hours, is ~200 min — against a published official gap of 212 min. The decomposition
      closes. (Cross-checked against a spatial gate decomposition, which reconciles to
      within 0.1 min of the official delta but whose per-leg values are contaminated once
      the boats are hours apart and no longer in the same weather — the time-aligned form
      above is the honest one.)"
  h1_offshore_at_dawn:
    claim: "Being further offshore paid at the Friday-dawn transition — the crew's own
      04:25 log entry ('we may benefit from being away from shore. Others not as
      concerned tho')."
    verdict: "CONFIRMED, and it is the crew's own call. Regressing 3-hour VMC on offshore
      distance AND along-course position (to remove the confound that leaders were both
      further east and in more breeze) over the 36 boats within +/-8 nm of Max's
      distance-to-finish at 05:00 Friday:
        VMC = 12.03 + 0.214 * offshore_nm - 0.0735 * dtf0   R2 = 0.487
        partial corr(offshore, VMC | dtf0) = +0.640
      Every extra mile offshore was worth +0.21 kt. Max was 4.9 nm offshore; Katara56, at
      effectively the same distance-to-finish, was 8.2 nm offshore and made 3.91 kt to
      Max's 1.61 kt over those three hours, converting a level match into a 6.4 nm lead
      by 08:00."
    important_caveat: "The SAME regression run over the night ITSELF (22:00 Thu -> 05:00
      Fri) gives the OPPOSITE sign — partial corr -0.270, R2 only 0.09. Offshore did not
      pay during the night; it paid at dawn."
    why_it_flipped: "THE OBSERVATIONS EXPLAIN THE SIGN CHANGE, and this is the strongest
      result in the whole record because it is observed rather than modelled. Differencing
      the two NDBC stations that bracket the fleet cross-shore — 44065 (NY Harbor
      entrance, ~15 nm offshore) minus 44069 (inside Great South Bay) — the gradient
      REVERSES at almost exactly the hour the fleet regression reverses:
        02:00 -0.2   03:00 -0.8   04:00 -2.8   05:00 -1.9   06:00 -0.5   07:00 -0.3 kn
        08:00 +0.0   09:00 +2.4   10:00 +2.9   11:00 +1.8 kn
      Negative = the inshore station had more wind. Overnight the northerly land breeze
      favoured the beach; from ~08:00 the advantage swung offshore and stayed there.
      That is a textbook land-breeze-to-gradient transition, and it means BOTH regression
      results are correct for their own hours. Max committed inshore at 04:25 — right for
      the next three hours, wrong for the window that decided the race."
    caveat_on_the_caveat: "44069 sits INSIDE Great South Bay, behind Fire Island, so it is
      a sheltered-bay station, not an inshore-ocean one. Treating it as 'inshore ocean
      wind' is a stretch and the magnitudes should not be quoted as a true cross-shore
      gradient. What is defensible is the SIGN CHANGE and its timing, which independently
      corroborates the fleet data. Any caption must name the two stations and say the
      gradient is inferred from a two-station difference, one of them in a bay."
  h2_boatspeed_not_just_position:
    claim: "Position alone does not explain Max's dawn loss."
    verdict: "SUPPORTED. In the dawn-transition regression Max has the WORST residual of
      all 36 boats in the band: -1.10 kt slower than her own position predicts. Over the
      wider 05:00-12:00 park exit she is 3rd worst at -0.54 kt. Something beyond
      cross-shore placement was costing her — light-air mode, sail crossover, or current.
      The crew log records A2 up, then A3 raised at 09:00, then doused for the jib at
      11:00, which is consistent with a boat hunting for a mode. STAGE-2 WORK: separate
      position from speed properly, and check the Fire Island / Moriches tidal set before
      attributing any of it to trim."
  h3_night_2_sound_side:
    claim: "The Sound side chosen on night 2 cost Max more than the first night did."
    verdict: "SUPPORTED, and it is the larger of the two losses (-10.7 nm vs -9.7 nm).
      Regression over the 14 boats within +/-14 nm of Max, 21:00 Fri -> 03:00 Sat:
        VMC = 11.48 + 0.119 * dist_from_LI_north_shore_nm - 0.131 * dtf0   R2 = 0.784
        partial corr = +0.503   (RAW corr is -0.020 — the confound completely masks it)
      Distance from the Long Island (NY) shore paid at +0.12 kt per mile. Max spent the
      night 2.0 nm off the NY shore — the crew log records the decision at 21:00:
      'Slightly more wind on CT side but not a lot, and later NY side may have sea breeze.
      team decided not worth the distance to go over, and would hug the land for land
      breeze.' The fleet data says the mid-Sound/CT option was the faster one."
    confidence: "MODERATE, NOT HIGH — n=14, two predictors, and Lioness is a clear
      counter-example (northernmost AND fastest). The raw correlation is zero and only the
      partial correlation carries the signal, which makes this claim entirely dependent on
      the confound model being right. Stage 2 must re-derive it through the pipeline with
      a larger band before any caption states it."
  h4_pattern_across_both_nights:
    claim: "The same decision shape appears twice: the crew identified the correct side
      and declined to commit to it."
    verdict: "PROPOSED — this is the candidate spine for the tier-3 narrative, and it is
      the strongest thing in the race. It rests on pairing the crew log against the fleet
      data at two moments (04:25 Friday, 21:00 Friday). It is ALSO the claim most exposed
      to hindsight bias and to the small-n weakness in h3. It must not ship until stage 2
      re-derives both regressions through the pipeline, and it must be written as what the
      fleet did, never as what the crew should have known at the time — the 04:25 entry
      itself records that the information was ambiguous and that others read it
      differently."

weather_evidence:
  landed: "races/alir2026/raw/weather/ — see MANIFEST.md and weather_manifest.json there
    for verified coverage, evidence classes, rejections and sha256s."
  new_capability_this_race: "ARCHIVED FORECASTS as a distinct evidence class. 2025 carried
    observed (NDBC), model reanalysis (ERA5) and predicted current (CO-OPS). 2026 adds what
    the models were SAYING during the race — archived HRRR and ECMWF runs, plus
    previous-run (lead-time) views — because the owner's question is explicitly a
    forecast-versus-reality question ('forecasts change wildly. always try to get the
    latest model and verify with reality', crew log 04:25). This is the evidence that can
    turn h1's dawn finding from 'offshore paid' into 'here is what the models promised, here
    is what verified, and here is what a navigator could have known at 04:25'."
  scope_guard: "UNCHANGED AND NON-NEGOTIABLE: weather files are stage-1/2/3 evidence only.
    No pipeline number may depend on them; the pipeline consumes tracks/results/scratch
    exclusively. I18 stands — VMC, never VMG. Every wind-referenced claim cites these files
    as external evidence and never implies the tracker measured wind."
  forecast_verification:         # EXPLORATORY; the owner's own question, answered with numbers
    question: "The crew log records the navigator's working belief at 04:25 Friday: 'HRRR
      model (more in line w what has happened and navigators seem to trust it more for
      short term forecasts)'. Did HRRR in fact verify better?"
    answer: "SPLIT — and the split is the useful part. Scored against 44065, the only
      offshore wind observation near the course, over 7/24 02:00-11:00 EDT:
        HRRR   mean signed error +2.1 kn, mean absolute error 2.3 kn  (over-forecast)
        ECMWF  mean signed error -1.4 kn, mean absolute error 1.4 kn  (under-forecast)
      ECMWF was the better SPEED forecast — HRRR promised 8.9 kn at 04:00 and 7.3 kn at
      08:00 where the buoy recorded 3.6 and 3.9. But HRRR tracked DIRECTION much better:
      its N-to-NE veer (011° -> 050°) matches the observed 321° -> 033°, while ECMWF
      wandered to 111° by 10:00 against an observed 033°.
      So the crew read HRRR correctly for the shift they acted on, and HRRR was right
      about it — while over-forecasting pressure by roughly 60%, which is exactly the
      error that makes a light-air park look survivable."
    night_2: "Same pattern in the western Sound. KPTN6 observed 10.0 kn at 19:00 collapsing
      to 1.3-1.7 kn from 22:00-00:00, then rebuilding from the EAST (070-092°) after 01:00.
      HRRR held 2.9-3.9 kn through the collapse from 171-184°; ECMWF gave 2.1-3.3 kn and
      caught the easterly backing (090° at 00:00, 055° at 01:00). HRRR over-forecast the
      western Sound — the side Max chose — for a second time."
    limitation_to_fix_at_stage_1: "The five model points are strung ALONG the course, so
      they cannot resolve either cross-course gradient — the very axis both decisive
      findings turn on. Stage 1 must fetch paired cross-course points: an inshore/offshore
      pair off the south shore for the dawn window, and a CT-side/NY-side pair for the
      Sound. Until then the cross-shore story rests on the two NDBC stations and on the
      fleet's own behaviour, and the captions must say so."

trim_adjustments:                # the inherited 2025 trimmer misfired on 2026 data; both
                                 # fixes are recorded because each was a real near-miss
  - "PRE-START SPIKE ate a whole boat. Elizabeth (RET) carries a GPS spike before her gun;
    the 2025 rule scanned from the first ping, found 'vehicle speed' at 16:26Z on day one,
    and cut her END before her START — dropping all 967 pings of a boat that raced. FIX:
    scan only pings at or after start_cut. Elizabeth now keeps 582."
  - "ONE-MINUTE CADENCE broke the vehicle-speed rule. 2026's ~1-minute tier makes ordinary
    GPS jitter read as 26-91 kt for a single interval, and the 2025 rule cut on the first
    such interval — truncating five boats that were still racing (Cool Change, Avatar,
    Yopo, WANDERER, Three Little Birds) in the middle of the race. FIX: require THREE
    consecutive over-threshold intervals. A glitch gives at most two (out and back); a car
    or tow is fast for many. Verified: all five now retain full tracks to the snapshot."
  - "Net effect 51,421 -> 45,608 rows, 53 racing boats retained, none dropped. The
    still-racing boats end at the snapshot (00:45 EDT 07-26) as they should."
  generalization_note: "Both fixes are generic, not ALIR-specific — any tracker feed can
    carry a pre-start spike or a sub-minute cadence. They strengthen the case in
    docs/OPEN_THREADS.md for promoting trim_tracks.py into starter/pipeline/ now that a
    second race has exercised it."

ping_cadence:
  nominal: "median 300 s, but bimodal — 40.3% of intervals <=60 s, 58.7% 61-300 s,
    0.8% 301-600 s, 0.07% 601-1800 s, 0.16% >1800 s (n=50,841)"
  focus_boats: "Max max in-race gap 5 min; Katara56, Zammermoos, Poseidon all <=10 min.
    The boats carrying the narrative have effectively unbroken coverage."
  grid_justification: "grid.minutes 15 with interpolate_limit 4 (1 h of bridging) sits well
    above the cadence and covers every in-race gap. Default is correct."

tier: 3                          # FIRST tier-3 build in the repo (owner-requested)
tier_note: "Tier 3 = story site: narrative post with embedded visualizations, hosted. It is
  a strict superset of tier 2, so it REQUIRES the tier-2 layer — client boat highlighted,
  log events on the track, log<->tracker reconciliation. The crew log supplies that layer;
  see privacy below. The tier-3 spine proposed for owner review is h4 (the two-nights
  pattern), told through h1 and h3 with the archived-forecast evidence carrying the
  'what could we have known' question."
grid_minutes: 15
scoring:
  system: custom                 # mixed ORC ToT + PHRF ToD; hook scoring_alir:corrected
  params: { rating_column: rating, hook: "scoring_alir:corrected" }
  probe_boats: ["Max", "Habiru YCC", "Zammermoos"]
  probe_result: "all 42 AOK rows reproduce official corrected within 1 s (36 ToD + 6 ToT)"
  noise_floor_min: 10
  noise_floor_basis: "~3 s/mi rating-assignment uncertainty x 207 nm ~ 10 min, the 2025
    basis, and it applies to the ToD divisions only. Division 9's margins are far above it
    (57:49 winner-to-second; Max 3:32:04 behind Katara56), so unlike 2025 the floor is NOT
    load-bearing for the hero's story. It IS load-bearing for any ORC claim, where the
    floor is a different quantity entirely — state it separately or not at all."

client_boat: "Max"               # hero AND pipeline pivot; the owner crewed her.
                                 # No dual-focus complication this year (Daffodil not entered).
reference_boats:
  - { name: "Katara56", why: "X-Yacht 56, Division 9 third — and the analytical spine of the
      whole build: IDENTICAL -18 rating, so her elapsed gap to Max IS the corrected gap.
      Every loss claim in this record is benchmarked against her (doctrine 5)." }
  - { name: "Zammermoos", why: "Club Swan 42, Division 9 winner — the class benchmark" }
  - { name: "Poseidon", why: "Swan 45, Division 9 second" }
  - { name: "Habiru YCC", why: "J/121, ORC Division 0 winner; the 2025 default-highlight
      boat, so she carries continuity between the two dashboards" }
  - { name: "Lioness", why: "Spinnaker Division 8 winner and the standout PHRF corrected
      performance; ALSO the counter-example to h3 — northernmost in the Sound on night 2
      and still fastest. A reference set that omitted her would be flattering the
