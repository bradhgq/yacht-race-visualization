# ALIR 2026 — Around Long Island Regatta (49th), Sea Cliff YC
# Schema of record: skills/race-viz/references/schemas.md.
# DATA: stage-0 REDO fetch 2026-07-26T10:0x EDT (owner instruction) — every
# Around-Long-Island-course boat now resolved: 45 AOK + 7 RET; the only
# unscored boat is Nomad (Around the Islands course, out of scope — no results
# row at all, not marked abandoned). THE HERO'S FINISH WAS AMENDED by the RC
# (third fetch, ~14:00 EDT): 12:38:03 -> 11:57:18, six seconds from her YB
# line marker, confirming owner + tracker. DUET/MARIE/Ripple's gaps remain
# unamended and stay flagged.
# NOTE the SI's "not finishing by 1200 Sunday shall call the RC" line is a
# NOTIFICATION requirement, not a hard time limit — two boats finished Sunday
# afternoon and scored AOK. Results remain formally 'Preliminary' on
# YachtScoring; the stage-1 redo (press/interviews) is still queued
# (docs/OPEN_THREADS.md).

race:
  name: "Around Long Island Regatta"
  edition: 2026
  slug: alir2026
  organizer_url: "https://www.yachtscoring.com/emenu/50645"   # event site: www.alir.org

tracker:
  vendor: yb                    # YB race id alir26. satTrackingUrl EMPTY in YS metadata
                                # (same as alir2025's re-fetch) — id verified by the full
                                # ritual instead: RaceSetup fleet == entry list, first pings
                                # NY Harbor 07-23 ~12:00 EDT, per-division starts == warning+5,
                                # committee marker "STARTING LINE (+ FINISH)" sits 0.06 nm off
                                # the SI start coordinate then anchors at the finish light.
  path: raw/alir2026_tracks_clean.csv   # produced by trim_tracks.py (see that file's header)

official_results:
  path: raw/alir2026_results_local.csv   # derived by derive_results_columns.py from
                                         # raw/alir2026_results.csv: adds finish_local +
                                         # retire_reason. The 2025 EDT-as-Z mislabel PERSISTS
                                         # in 2026 (probe: six boats at exactly +4.00 h, each
                                         # within 0.05 nm of the Glen Cove light) — strip the
                                         # fake Z, apply NO shift.
  columns:
    rank: place_overall         # per scoring group (three boats carry rank 1; see scope record)
    name: boat_name
    sail: sail_number
    rating: rating
    elapsed: elapsed_hms
    corrected: corrected_hms
    type: design
    finish_local: finish_local
    division: class_name        # class_name carries the real division; the 'division'
                                # column is uniformly "PHRF" and useless as meta.cls
    class_rank: place_class
    status: finish_status
    retire_reason: retire_reason
  finish_statuses: [AOK]        # observed statuses: AOK / RET
  untracked_meta_only: []       # every scored boat is tracked (coverage matrix, scope record)

entries: { path: raw/alir2026_scratch_sheet.csv }

course:                         # SI-identical to 2025 (Final 2026 ALIR SI, same three
                                # coordinates verbatim; sha256 + URL in the scope record).
                                # 2025 polyline reused; every leg RE-VERIFIED against the 2026
                                # fleet: routed DTF monotone for all finishers, no leg
                                # inshore of the sailed envelope (scope record, course_model).
  type: marks                   # routed DTF via pipeline/route.py
  start: [40.7028, -74.0367]    # SI: line ~0.25 nm NE of Ellis Island (40°42'10"N 74°02'12"W)
  finish: [40.8619, -73.6603]   # SI: light on Glen Cove Breakwater (40°51'43"N 73°39'37"W)
  official_length_nm: 207.0     # SI: "considered 207 nm for scoring purposes"; corroborated —
                                # ToD arithmetic reproduces official corrected EXACTLY at
                                # 207.0 for all 36 PHRF AOK rows
  finish_radius_nm: 0.4         # 2025 lesson: Hempstead Harbour approach doubles back past
                                # the line; 0.7 cuts ghost tracks early. Keep 0.4; re-verify
                                # the ghost-cut count at stage 2.
  marks:                        # 2025 polyline (205.84 nm, delta -1.16 vs official 207.0)
    - [40.6060, -74.0450]       # Verrazzano Narrows mid-span
    - [40.5281, -74.0094]       # Ambrose Channel Red Bell Q R "14" — the ONE mandatory mark (SI)
    - [40.5500, -73.4000]       # south-shore spine (2025 sailed-median draft)
    - [40.6400, -73.0500]
    - [40.7700, -72.6000]
    - [40.8600, -72.1000]       # Moriches/Shinnecock offing (2025 fix — beach-crossing chord)
    - [41.0600, -71.8450]       # Montauk Point rounding
    - [41.1680, -72.2150]       # Plum Gut (2026: gate again chosen by most of the fleet;
                                #   exact per-boat gate table in the scope record)
    - [41.0500, -73.3500]       # mid-Sound, clearing Eatons Neck
    - [40.9250, -73.6250]       # Matinecock/Prospect Point offing (2025 fix)
  mark_radius_nm: 1.0
  arrival_search_after_nm: 0    # re-verify at stage 2 (2025: 11+ nm clearance, no false arrival)

time:
  official_tz: America/New_York
  utc_offset: -4
  tz_label: EDT
  race_start_utc: '2026-07-23T16:00:00+00:00'   # tracker live 12:00 EDT, 1 h before the
                                                # 13:00 first warning
  tz_probe:                     # stage-0 verified (scope record has the multi-boat table).
                                # Probe boat is Katara56, NOT the hero: Max is one of four
                                # boats whose official finish sits far from her track's line
                                # crossing (+40.9 min) — flagged, unresolved, never smoothed.
    boat: "Katara56"
    official_finish_local: '2026-07-25 09:05:59'
    track_epoch_utc: 1784984761   # 2026-07-25T13:06:01Z, 0.03 nm from the breakwater light

scoring:
  system: custom                # MIXED-SYSTEM YEAR: PHRF divisions (incl. Non-Spin, DH,
                                # Multihull) score time-on-distance at 207.0 nm; the NEW ORC
                                # Division 0 scores time-on-time (multiplier). Ratings are
                                # disjoint by construction (ORC 0.83..0.97 float multipliers;
                                # PHRF integer sec/mi -24..171, nothing in (0,2)), so the
                                # hook dispatches on rating value alone — build_data passes
                                # only {'rating'} to scoring.corrected.
  params:
    rating_column: rating
    hook: "scoring_alir:corrected"   # races/alir2026/scoring_alir.py
  probe_boats: ["Max", "Habiru YCC", "Zammermoos"]   # probes span BOTH systems:
                                # Max and Zammermoos ToD, Habiru YCC ToT — the stage-0 sweep
                                # reproduced all 42 AOK rows (36 ToD + 6 ToT) within 1 s

start_method: finish_minus_elapsed   # reproduces warning + 5 min exactly for all 9 divisions
                                     # with finishers. YB RaceSetup.teams[].start carries the
                                     # WARNING epochs for most divisions in 2026 (not gun) —
                                     # corroboration only; see scope record start_method.
divisions_in_scope:             # ALI course only. Nomad (Around the Islands course, 242 or
                                # 230 nm per conflicting SI sections — flagged) is out of
                                # scope and still racing at snapshot.
  - "Non-Spinnaker Division 1 - Warning Signal 13:00"
  - "Non-Spinnaker Division 2 - Warning Signal 13:00"
  - "Spinnaker Division 3 - Warning Signal 13:10"
  - "Spinnaker Division 5 - Warning Signal 13:20"
  - "Spinnaker Division 7 - Warning Signal 13:30"
  - "Spinnaker Division 8 - Warning Signal 13:40"
  - "Spinnaker Division 9 - Warning Signal 13:50"
  - "ORC Division 0 - Warning Signal 13:40"
  - "Double-Handed Division 4 - Warning Signal 14:10"
  - "Multihull (NEMA) Division M - Warning Signal 14:00"

client_boat: "Max"              # hero and analysis pivot — the owner crewed her. Single
                                # focus this year (no dual-focus complication: Daffodil is
                                # not entered in 2026).
reference_boats:                # documentation only (no pipeline consumer) — proposed set,
                                # owner confirms at the stage-0 stop
  - "Zammermoos"                # Club Swan 42, Division 9 winner — the class benchmark
  - "Katara56"                  # X-Yacht 56, SAME -18 rating as Max: corrected gap == elapsed
                                # gap (3:32:04), the cleanest like-for-like comparison
  - "Poseidon"                  # Swan 45, Division 9 second
  - "Habiru YCC"                # J/121, ORC Division 0 winner (2025 default-highlight boat)
  - "Lioness"                   # Spin Division 8 winner, best PHRF corrected overall
tier: 3                         # FIRST tier-3 build: story site with a navigational-opinions
                                # narrative (owner-requested); structure proposed at the
                                # stage-0 stop, executed stages 2-4

name_overrides:
  by_id: {}
  by_name:                      # tracker (YB) name -> results (YS) name
    "Habiru": "Habiru YCC"      # DUPLICATE-ENTRY TRAP (the 2025 Dolcezza lesson, new
                                # costume): scratch carries INACTIVE "Habiru" AND ACTIVE
                                # "Habiru YCC", same sail USA61124; the tracker name "Habiru"
                                # must bind to the ACTIVE ORC entry, not the withdrawn row
    "Little Texas YCC": "Little Texas"   # REVERSED from 2025: YB carries the YCC suffix
                                         # this year, YS does not
  display:                      # results name -> shipped display name (case cleanup only)
    "ACTAEA": "Actaea"
    "ARGOS": "Argos"
    "DUET": "Duet"
    "MARA": "Mara"
    "MARIE": "Marie"
    "SCAPEGOAT": "Scapegoat"
    "WANDERER": "Wanderer"
    "VICITAN": "Vicitan"
    "BETELGEUSE YCC": "Betelgeuse YCC"

groups:
  hero_key: hero                # Max
  by_name:
    class9: ["Zammermoos", "Poseidon", "Katara56"]   # the whole of Max's division
    orc0: ["Habiru YCC", "Ohana", "Della Aurora", "Surface Tension", "Imagine", "Beagle"]
  by_cls: {}
  by_rank: {}
  default_key: fleet_other
  dnf_key: fleet_dnf

exclude_boats:
  - "STARTING LINE (+ FINISH)"  # committee line marker (tracks only; starts at the start
                                # line, ends anchored at the finish) — the only exclusion.
                                # No racing boat is excluded; the 7 still-racing boats stay
                                # in the data as tracked-unscored (fleet ghosts) for the
                                # preliminary build.
extra_boats: []

grid: { minutes: 15, end_utc: '2026-07-26T21:30:00+00:00', interpolate_limit: 4 }
                                # last in-scope finisher (Cool Change, 17:13:54 EDT 07-26
                                # = 21:13:54Z) + pad
sog: { half_window_s: 900, min_span_s: 600 }
fleet: { resample: 1h, min_points: 5 }
milestones: { start_nm: 200, step_nm: 20 }
finish_pad_min: 3

events: { path: events.yaml }   # placeholder list only in this draft. The crew-log-derived
                                # event proposal is presented at the stage-0 stop and enters
                                # the repo item-by-item on owner opt-in (prime rule 4) — the
                                # raw log never does.
event_categories: [crew, systems, sail, tactics, insight, milestone]

zone_detection:                 # expected stage-2 candidates: the day-2 morning south-shore
  band_nm: 10                   # park (the whole fleet slowed 07-24 ~01:00-12:00 EDT) and
  collapse_frac: 0.5            # the night-2 Sound park ("whenever we get to breeze line it
  min_traversal_hours: 6        # recedes"). Detection proposes; the stage-2 stop decides.

finish_spread: { window_min: 30, min_boats: 10 }
noise_floor_min: 10             # same basis as 2025: ~3 s/mi rating-assignment uncertainty
                                # x 207 nm ~ 10 min (ToD divisions). Division 9 margins this
                                # year (57:49 to 2nd, 3:32:04 hero-to-Katara56) sit far above
                                # it; ORC margins are ToT and need their own statement at
                                # stage 2 if narrated tightly.

privacy: { build: private }     # OWNER DECLARATION (2026-07-26): this build IS the private
                                # opinionated cut — the watch layer and watch-performance
                                # module ship here and are STRIPPED from the future public
                                # cut, which gets its own stage-5 opt-in pass.

output:
  dir: out/
  generated: '2026-07-26'   # pinned to the snapshot's build date (alir2025/nb/bir precedent) —
                            # unpinned, any later-day rebuild fails the snapshot compare

pinned_values:                  # PRELIMINARY PINS (prime rule 3) — pinned at the stage-2 stop
                                # from official PROVISIONAL results by recorded owner
                                # instruction (stage-0 stop, 2026-07-26: proceed now on the
                                # mid-race snapshot; redo stages 0-1 and RE-PIN on final
                                # results). Full derivations: tests/regression.json _comment.
  tz_probe: { epoch: 1784984761, rendered: '2026-07-25 09:06' }   # Katara56's crossing
  endpoints: { ref: "Katara56", corrected_min: 171.32, elapsed_min: 171.32 }   # hero(Max) − ref,
                                # on the AMENDED official results (Max finish corrected by the
                                # RC to 11:57:18). The GAPS are equal by construction (same -18
                                # rating; each boat's corrected = her elapsed + 62:06)
  module_canaries: {}           # no zone module shipped yet — the detector found no candidate
                                # at default knobs; the authored-zone decision is at the stop
  names_present: ["Max", "Zammermoos", "Poseidon", "Katara56", "Habiru YCC", "Lioness",
                  "Abilyn", "Actaea", "Duet", "Marie", "Scapegoat", "Vicitan",
                  "Betelgeuse YCC", "Little Texas", "Wanderer"]
  names_absent: ["ACTAEA", "DUET", "MARIE", "SCAPEGOAT", "VICITAN", "BETELGEUSE YCC",
                 "Habiru", "Little Texas YCC", "STARTING LINE (+ FINISH)"]
  names_meta_only: []
  finstrip_count: 0             # largest in-division 30-min corrected cluster: 3 boats (Div 5)
